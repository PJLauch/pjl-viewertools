name: Feature request
description: Suggest a viewer-assistant feature
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the Twitch chat situation, not only the desired button.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Preferred workflow
      description: How should a viewer use this feature?
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The user remains in control and no message is sent automatically.
          required: true
        - label: The feature can work locally without telemetry or an account.
          required: true
